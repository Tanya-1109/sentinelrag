[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelrag"
version = "0.1.0"
description = "An evidence-grounded cybersecurity investigation assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kriti" }
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic-settings>=2,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
sentinelrag = "sentinelrag.cli:main"
sentinelrag-sources = "sentinelrag.source_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"